<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HA Climate Card – Demo</title>
  <style>
    :root {
      --primary-color: #03a9f4; --primary-text-color: #212121; --secondary-text-color: #727272;
      --card-background-color: #fff; --divider-color: rgba(0,0,0,0.12); --text-primary-color: #fff;
      --warning-color: #ff9800; --error-color: #db4437;
      font-family: Roboto, system-ui, sans-serif;
    }
    body { background: #f0f2f5; color: var(--primary-text-color); margin: 0; padding: 24px; }
    body.dark {
      --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --card-background-color: #1c1c1c;
      --divider-color: rgba(255,255,255,0.12); background: #111;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; }
    h2 { font-size: 14px; color: var(--secondary-text-color); margin: 0 0 6px; font-weight: 500; }
    #log { font: 12px monospace; white-space: pre-wrap; margin-top: 16px; color: var(--secondary-text-color); }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <div id="log"></div>

  :host { display: block; }
  ha-card {
    position: relative; overflow: hidden; padding: 16px; box-sizing: border-box; height: 100%;
    display: flex; flex-direction: column; gap: 14px;
    transition: background 0.4s;
  }
  .glow {
    position: absolute; inset: -40% -20% auto -20%; height: 70%; pointer-events: none;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 18%, transparent), transparent);
    transition: background 0.6s;
  }
  ha-card.compact .glow { inset: -60% -30% auto auto; width: 70%; height: 140%; }
  button { font: inherit; color: inherit; }

  /* Header */
  .header { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .title {
    display: flex; align-items: center; gap: 12px; background: none; border: none; padding: 0;
    cursor: pointer; text-align: left; min-width: 0;
  }
  .icon-badge {
    flex: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent);
    transition: background 0.4s, color 0.4s;
  }
  .icon-badge.active ha-icon { animation: breathe 2.4s ease-in-out infinite; }
  .names { display: flex; flex-direction: column; min-width: 0; }
  .name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { font-size: 13px; color: var(--secondary-text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .power {
    flex: none; width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(127,127,127,0.12); color: var(--secondary-text-color);
    display: flex; align-items: center; justify-content: center; transition: background 0.25s, color 0.25s;
  }
  .power.on { background: var(--accent); color: var(--text-primary-color, #fff); }
  .power:focus-visible, .title:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Window banner */
  .banner {
    position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; cursor: pointer;
    background: color-mix(in srgb, var(--warning-color, #ff9800) 18%, transparent); color: var(--primary-text-color);
  }
  .banner ha-icon { color: var(--warning-color, #ff9800); flex: none; }
  .banner div { display: flex; flex-direction: column; font-size: 13px; }
  .banner span { color: var(--secondary-text-color); font-size: 12px; }

  /* Dial */
  .dial-center { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .dial-label { font-size: 13px; color: var(--secondary-text-color); text-transform: uppercase; letter-spacing: 0.06em; }
  .dial-big { font-size: clamp(40px, 13vw, 58px); font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
  .dial-big sup, .big sup { font-size: 0.4em; font-weight: 400; vertical-align: top; margin-left: 2px; position: relative; top: 0.25em; }
  .dial-range { font-size: clamp(28px, 9vw, 38px); font-weight: 400; display: flex; gap: 6px; align-items: baseline; }
  .dial-range .sep { color: var(--secondary-text-color); font-size: 0.7em; }
  .dial-sub { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--secondary-text-color); margin-top: 4px; }
  .dial-sub ha-icon { --mdc-icon-size: 16px; margin-left: 4px; }
  .dial-steppers { display: flex; justify-content: center; gap: 16px; margin-top: -24px; position: relative; flex-wrap: wrap; }
  .dial-steppers.dual { gap: 8px; margin-top: -8px; }
  hcc-climate-dial { margin-bottom: -16px; }
  .round {
    width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(127,127,127,0.12); display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.1s;
  }
  .round:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }
  .round:active { transform: scale(0.92); }

  /* Stepper */
  .stepper {
    display: inline-flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px;
    background: rgba(127,127,127,0.12);
  }
  .stepper button {
    width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer; background: transparent;
    display: flex; align-items: center; justify-content: center; color: var(--accent, var(--primary-text-color));
  }
  .stepper button:hover { background: color-mix(in srgb, var(--accent, #888) 20%, transparent); }
  .stepper-value { min-width: 54px; text-align: center; font-size: 18px; font-weight: 600; }
  .stepper-value small { font-size: 11px; font-weight: 400; color: var(--secondary-text-color); margin-left: 1px; }

  /* Controls */
  .controls { position: relative; display: flex; flex-direction: column; gap: 14px; }
  .row-label {
    display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--secondary-text-color);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .row-label ha-icon { --mdc-icon-size: 16px; }
  .humidity-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .graph-wrap { display: flex; flex-direction: column; gap: 6px; }

  /* Compact */
  .compact-row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .compact-current { display: flex; flex-direction: column; }
  .big { font-size: 34px; font-weight: 300; line-height: 1; }
  .compact-steppers { display: flex; gap: 6px; flex-wrap: wrap; }
  .expand {
    position: relative; align-self: center; display: flex; align-items: center; gap: 2px; border: none; background: none;
    color: var(--secondary-text-color); cursor: pointer; font-size: 12px; padding: 2px 8px; border-radius: 999px; margin: -6px 0;
  }
  .expand:hover { background: rgba(127,127,127,0.12); }

  .warning { padding: 8px; color: var(--error-color, #db4437); }
  ha-card.unavailable { opacity: 0.6; }

  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .icon-badge.active ha-icon { animation: none; } }

    // ---- Minimal-Stubs für HA-Elemente ----
    const toKey = (name) => "mdi" + name.replace(/^mdi:/, "").split("-").map((p) => p[0].toUpperCase() + p.slice(1)).join("");
    customElements.define("ha-icon", class extends HTMLElement {
      static get observedAttributes() { return ["icon"]; }
      set icon(v) { this._icon = v; this._r(); } get icon() { return this._icon; }
      attributeChangedCallback() { this._icon = this.getAttribute("icon"); this._r(); }
      connectedCallback() { this.style.display = "inline-flex"; this._r(); }
      _r() {
        const d = mdi[toKey(this._icon || "")] || "";
        (this.shadowRoot || this.attachShadow({ mode: "open" })).innerHTML = `<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);fill:currentColor"><path d="${d}"/></svg>`;
      }
    });
    customElements.define("ha-card", class extends HTMLElement {
      connectedCallback() {
        Object.assign(this.style, { background: "var(--card-background-color)", borderRadius: "16px",
          boxShadow: "0 2px 6px rgba(0,0,0,0.08)", border: "1px solid var(--divider-color)" });
      }
    });

    const params = new URLSearchParams(location.search);
    if (params.get("dark")) document.body.classList.add("dark");
    const lang = params.get("lang") || "de";
    const log = (m) => (document.getElementById("log").textContent += m + "\n");
    window.serviceCalls = [];

    const now = new Date().toISOString();
    const states = {
      "climate.wohnzimmer": { state: "cool", attributes: {
        friendly_name: "Wohnzimmer", supported_features: 1 | 8 | 16 | 32 | 128 | 256 | 512,
        hvac_modes: ["off", "auto", "cool", "heat", "dry", "fan_only"], hvac_action: "cooling",
        current_temperature: 25.4, temperature: 22, min_temp: 16, max_temp: 31, target_temp_step: 0.5,
        current_humidity: 54,
        fan_modes: ["auto", "low", "medium", "high", "turbo"], fan_mode: "auto",
        swing_modes: ["off", "vertical", "both"], swing_mode: "vertical",
        swing_horizontal_modes: ["off", "on"], swing_horizontal_mode: "off",
        preset_modes: ["none", "eco", "boost", "sleep"], preset_mode: "eco",
      }},
      "climate.buero": { state: "heat_cool", attributes: {
        friendly_name: "Büro", supported_features: 2 | 4 | 8,
        hvac_modes: ["off", "heat_cool", "heat", "cool"], hvac_action: "idle",
        current_temperature: 21.1, target_temp_low: 20, target_temp_high: 24, min_temp: 16, max_temp: 30,
        humidity: 45, min_humidity: 30, max_humidity: 70, current_humidity: 41,
        fan_modes: ["auto", "low", "high"], fan_mode: "low",
      }},
      "climate.schlafzimmer": { state: "off", attributes: {
        friendly_name: "Schlafzimmer", supported_features: 1 | 8,
        hvac_modes: ["off", "cool", "heat"], hvac_action: "off",
        current_temperature: 23.0, temperature: 20, min_temp: 16, max_temp: 30, fan_modes: ["auto", "low"], fan_mode: "auto",
      }},
      "sensor.wz_temp": { state: "25.1", attributes: { unit_of_measurement: "°C", device_class: "temperature" } },
      "sensor.aussen": { state: "31.6", attributes: { unit_of_measurement: "°C", device_class: "temperature" } },
      "sensor.klima_power": { state: "845", attributes: { unit_of_measurement: "W", device_class: "power" } },
      "sensor.klima_energy": { state: "3.42", attributes: { unit_of_measurement: "kWh", device_class: "energy" } },
      "binary_sensor.buero_fenster": { state: "on", attributes: { friendly_name: "Bürofenster", device_class: "window" } },
    };
    for (const [id, s] of Object.entries(states)) Object.assign(s, { entity_id: id, last_changed: now, last_updated: now });

    const cards = [];
    const makeHass = () => ({
      states: { ...states }, language: lang, locale: { language: lang },
      config: { unit_system: { temperature: "°C" } },
      async callService(domain, service, data) {
        window.serviceCalls.push({ domain, service, data });
        log(`${domain}.${service} ${JSON.stringify(data)}`);
        const s = states[data.entity_id];
        const attrs = { ...s.attributes };
        let st = s.state;
        if (service === "set_hvac_mode") st = data.hvac_mode;
        if (service === "turn_off") st = "off";
        if (service === "turn_on") st = attrs.hvac_modes.find((m) => m !== "off");
        for (const k of ["temperature", "target_temp_low", "target_temp_high", "humidity", "fan_mode", "swing_mode", "swing_horizontal_mode", "preset_mode"]) {
          if (k in data) attrs[k] = data[k];
        }
        states[data.entity_id] = { ...s, state: st, attributes: attrs, last_updated: new Date().toISOString() };
        setTimeout(() => { const h = makeHass(); cards.forEach((c) => (c.hass = h)); }, 150);
      },
      async callWS(msg) {
        const out = {};
        const end = Date.now() / 1000, start = end - 24 * 3600;
        for (const id of msg.entity_ids) {
          const arr = [];
          for (let t = start, i = 0; t < end; t += 1800, i++) {
            const cur = 23 + 2.5 * Math.sin(i / 7) + Math.random() * 0.3;
            arr.push(id.startsWith("climate")
              ? { s: i > 40 ? "off" : "cool", lu: t, a: { current_temperature: +cur.toFixed(1), temperature: i < 20 ? 23 : 22, hvac_action: cur > 23.5 && i <= 40 ? "cooling" : "idle" } }
              : { s: (cur - 0.2).toFixed(1), lu: t });
          }
          out[id] = arr;
        }
        return out;
      },
    });

    const configs = [
      ["Voll – Kühlen, alle Features", { entity: "climate.wohnzimmer", layout: "full", show: { graph: true },
        temperature_sensor: "sensor.wz_temp", outdoor_sensor: "sensor.aussen", power_sensor: "sensor.klima_power", energy_sensor: "sensor.klima_energy" }],
      ["Voll – Bereich heat_cool + Fenster offen", { entity: "climate.buero", layout: "full", window_sensor: "binary_sensor.buero_fenster", outdoor_sensor: "sensor.aussen" }],
      ["Voll – Aus", { entity: "climate.schlafzimmer", layout: "full" }],
      ["Kompakt – Kühlen", { entity: "climate.wohnzimmer", layout: "compact", outdoor_sensor: "sensor.aussen", power_sensor: "sensor.klima_power" }],
      ["Kompakt – Bereich", { entity: "climate.buero", layout: "compact", window_sensor: "binary_sensor.buero_fenster" }],
      ["Kompakt – Aus", { entity: "climate.schlafzimmer", layout: "compact" }],
    ];

    const hass = makeHass();
    const grid = document.getElementById("grid");
    configs.forEach(([title, cfg], i) => {
      const wrap = document.createElement("div");
      wrap.innerHTML = `<h2>${title}</h2>`;
      const card = document.createElement("ha-climate-card");
      card.id = "card" + i;
      card.setConfig({ type: "custom:ha-climate-card", ...cfg });
      card.hass = hass;
      wrap.appendChild(card);
      grid.appendChild(wrap);
      cards.push(card);
    });
    window.__ready = true;
  </script>
