name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check committed bundle is up to date
        run: git diff --exit-code -- dist demo/index.html || (echo "::error::dist/ bzw. demo/index.html sind nicht aktuell – bitte 'npm run build' ausführen und committen" && exit 1)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
